<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>培训班课时打卡</title>
    <script src="https://aisearch-task.bj.bcebos.com/static/tailwindcss-3.4.17.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        secondary: '#EC4899',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
            .safe-top { padding-top: env(safe-area-inset-top, 0); }
            .breathing { animation: breathing 2s ease-in-out infinite; }
            @keyframes breathing {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 pb-16">
    <div id="app" class="max-w-md mx-auto relative">
        <!-- 顶部导航 -->
        <header class="sticky top-0 bg-white shadow-sm safe-top" style="z-index: 9999;">
            <div class="px-4 h-14 flex items-center justify-between">
                <h1 class="text-lg font-bold text-primary">培训班打卡</h1>
                <div class="flex items-center gap-1">
                    <button id="add-btn" aria-label="添加课程" class="w-9 h-9 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button id="settings-btn" aria-label="设置" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <!-- 孩子切换 -->
            <div class="px-4 pb-2 overflow-x-auto">
                <div id="kid-switcher" class="flex gap-2 pb-1 whitespace-nowrap"></div>
            </div>
        </header>

        <!-- 主内容 -->
        <main class="px-4 pt-3">
            <div id="page-home"></div>
            <div id="page-schedule" class="hidden"></div>
            <div id="page-records" class="hidden"></div>
            <div id="page-stats" class="hidden"></div>
        </main>

        <!-- 底部导航 -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 safe-bottom" style="z-index: 9999;">
            <div class="max-w-md mx-auto h-14 flex items-center justify-around">
                <button class="nav-btn active flex flex-col items-center gap-0.5 px-4 py-1 text-primary" data-page="home" aria-label="首页">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="text-xs">首页</span>
                </button>
                <button class="nav-btn flex flex-col items-center gap-0.5 px-4 py-1 text-gray-500" data-page="schedule" aria-label="课表">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span class="text-xs">课表</span>
                </button>
                <button class="nav-btn flex flex-col items-center gap-0.5 px-4 py-1 text-gray-500" data-page="records" aria-label="记录">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span class="text-xs">记录</span>
                </button>
                <button class="nav-btn flex flex-col items-center gap-0.5 px-4 py-1 text-gray-500" data-page="stats" aria-label="统计">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <span class="text-xs">统计</span>
                </button>
            </div>
        </nav>
    </div>

    <div id="modal-container"></div>

    <script>
        const STORAGE_KEY = 'course_tracker_v2';
        const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
        const SHORT_WEEK = ['日','一','二','三','四','五','六'];
        
        let data = localStorage.getItem(STORAGE_KEY) ? JSON.parse(localStorage.getItem(STORAGE_KEY)) : {
            currentKidId: 'k1',
            kids: [{id: 'k1', name: '大宝', avatar: '👦'}],
            courses: [],
            records: []
        };

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderCurrentPage();
            renderKids();
        }

        function getCurrentKid() {
            return data.kids.find(k => k.id === data.currentKidId) || data.kids[0];
        }

        function getCourses() {
            const kidId = getCurrentKid().id;
            return data.courses.filter(c => c.kidId === kidId || c.shared);
        }

        function getRemaining(course) {
            const used = data.records
                .filter(r => r.courseId === course.id && (!r.isLeave || course.deductLeave))
                .reduce((s, r) => s + (r.hours || 1), 0);
            return Math.max(0, course.total - used);
        }

        function getAttended(course) {
            return data.records.filter(r => r.courseId === course.id && !r.isLeave).length;
        }

        function getLeaveCount(course) {
            return data.records.filter(r => r.courseId === course.id && r.isLeave).length;
        }

        function formatDate(d) { return d.toISOString().split('T')[0]; }

        function getWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            return Array.from({length:7}, (_,i) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                return d;
            });
        }

        function getWeekSchedule() {
            const courses = getCourses().filter(c => c.hasFixed);
            const dates = getWeekDates();
            const schedule = [];
            dates.forEach(d => {
                const dow = d.getDay();
                const dayCourses = courses.filter(c => c.days.includes(dow)).map(c => {
                    const start = new Date(d);
                    const [h,m] = c.start.split(':').map(Number);
                    start.setHours(h,m,0,0);
                    const end = new Date(d);
                    const [eh,em] = c.end.split(':').map(Number);
                    end.setHours(eh,em,0,0);
                    const rec = data.records.find(r => r.courseId === c.id && formatDate(new Date(r.date)) === formatDate(d));
                    return {...c, start, end, rec};
                }).sort((a,b) => a.start - b.start);
                if(dayCourses.length) schedule.push({
                    date: d,
                    dateStr: formatDate(d),
                    week: WEEK[d.getDay()],
                    today: formatDate(d) === formatDate(new Date()),
                    courses: dayCourses
                });
            });
            return schedule;
        }

        function getTodayUpcoming() {
            const now = new Date();
            const sched = getWeekSchedule();
            const today = sched.find(d => d.today);
            if(!today) return [];
            return today.courses.filter(c => !c.rec).map(c => {
                const mins = Math.round((c.start - now)/60000);
                let text = '';
                if(mins < 0) text = '已到上课时间';
                else if(mins < 60) text = `${mins}分钟后`;
                else text = `${Math.floor(mins/60)}小时${mins%60}分钟后`;
                return {...c, countdown: text, urgent: mins >= -30 && mins < 0};
            });
        }

        let currentPage = 'home';

        function renderKids() {
            const el = document.getElementById('kid-switcher');
            const cur = getCurrentKid();
            let html = '';
            data.kids.forEach(k => {
                const active = k.id === cur.id;
                html += `<button class="kid-btn shrink-0 px-3 py-1.5 rounded-full text-sm ${active ? 'bg-primary text-white' : 'bg-gray-100 text-gray-700'}" data-id="${k.id}">${k.avatar} ${k.name}</button>`;
            });
            html += `<button id="add-kid" class="shrink-0 w-8 h-8 rounded-full border border-dashed border-gray-300 flex items-center justify-center text-gray-400 text-sm" aria-label="添加孩子">+</button>`;
            el.innerHTML = html;
        }

        function renderHome() {
            const el = document.getElementById('page-home');
            const now = new Date();
            const upcoming = getTodayUpcoming();
            const courses = getCourses();
            
            let html = `<div class="text-sm text-gray-500 mb-3">${now.getMonth()+1}月${now.getDate()}日 ${WEEK[now.getDay()]}</div>`;
            
            if(upcoming.length === 0) {
                html += `<div class="bg-white rounded-xl p-4 shadow-sm mb-4 text-sm text-gray-500 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    今天没有待上的课程~
                </div>`;
            } else {
                html += `<div class="mb-4">
                    <div class="text-sm font-medium mb-2 flex items-center gap-1"><span class="breathing text-danger">●</span> 今日课程</div>
                    ${upcoming.map(c => {
                        const kid = data.kids.find(k => k.id === c.kidId);
                        return `<div class="bg-white rounded-xl p-3 shadow-sm mb-2 ${c.urgent ? 'border border-danger' : ''}">
                            <div class="flex justify-between items-start mb-1">
                                <div class="flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>
                                    <span class="font-medium">${c.name}</span>
                                    <span class="text-xs text-gray-500">${kid.name}</span>
                                </div>
                                <button class="checkin-btn px-3 py-1 bg-primary text-white text-xs rounded-full" data-id="${c.id}">打卡</button>
                            </div>
                            <div class="flex justify-between text-xs text-gray-500">
                                <span>${c.start}-${c.end}${c.location ? ' · '+c.location : ''}</span>
                                <span class="${c.urgent ? 'text-danger font-medium' : 'text-warning'}">${c.countdown}</span>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            }
            
            const totalLeft = courses.reduce((s,c) => s + getRemaining(c), 0);
            const monthAttend = data.records.filter(r => {
                const d = new Date(r.date);
                return !r.isLeave && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear() && courses.some(c=>c.id===r.courseId);
            }).length;
            
            html += `<div class="grid grid-cols-3 gap-2 mb-4">
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <div class="text-xl font-bold text-primary">${courses.length}</div>
                    <div class="text-xs text-gray-500">课程数</div>
                </div>
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <div class="text-xl font-bold text-secondary">${totalLeft}</div>
                    <div class="text-xs text-gray-500">剩余课时</div>
                </div>
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <div class="text-xl font-bold text-success">${monthAttend}</div>
                    <div class="text-xs text-gray-500">本月打卡</div>
                </div>
            </div>`;
            
            html += `<h2 class="font-bold mb-2">我的课程</h2>`;
            if(courses.length === 0) {
                html += `<div class="bg-white rounded-xl p-8 text-center shadow-sm text-gray-500 text-sm">点击顶部 + 添加第一个课程</div>`;
            } else {
                html += `<div class="space-y-3">${courses.map(c => {
                    const kid = data.kids.find(k => k.id === c.kidId);
                    const left = getRemaining(c);
                    const attended = getAttended(c);
                    const leaves = getLeaveCount(c);
                    const progress = c.total > 0 ? Math.min(100, Math.round((c.total-left)/c.total*100)) : 0;
                    return `<div class="bg-white rounded-xl p-4 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>
                                <span class="font-medium">${c.name}</span>
                                ${c.shared ? '<span class="text-xs bg-purple-100 text-purple-700 px-1.5 rounded">共享</span>' : ''}
                                <span class="text-xs text-gray-500">${kid.avatar} ${kid.name}</span>
                            </div>
                            <button class="edit-btn text-gray-400 p-1" data-id="${c.id}" aria-label="编辑">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                            </button>
                        </div>
                        ${c.hasFixed ? `<div class="text-xs text-gray-500 mb-2">每周${c.days.map(d=>SHORT_WEEK[d]).join('、')} ${c.start}-${c.end}${c.location?' · '+c.location:''}</div>` : ''}
                        <div class="flex gap-3 text-xs mb-2">
                            <span class="text-success">已上${attended}节</span>
                            <span class="text-warning">请假${leaves}次</span>
                            <span class="text-primary">剩${left}课时</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5 mb-3">
                            <div class="h-1.5 rounded-full bg-primary" style="width:${progress}%"></div>
                        </div>
                        <div class="flex gap-2">
                            <button class="checkin-btn flex-1 py-2 bg-primary text-white text-sm rounded-lg" data-id="${c.id}">✓ 打卡</button>
                            <button class="leave-btn flex-1 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg" data-id="${c.id}">请假</button>
                        </div>
                    </div>`;
                }).join('')}</div>`;
            }
            
            el.innerHTML = html;
        }

        function renderSchedule() {
            const el = document.getElementById('page-schedule');
            const sched = getWeekSchedule();
            let html = '<h2 class="font-bold mb-3">本周课表</h2>';
            if(sched.length === 0) {
                html += '<div class="bg-white rounded-xl p-8 text-center text-gray-500 text-sm shadow-sm">设置固定时间后会在这里显示课表</div>';
            } else {
                html += sched.map(day => `<div class="bg-white rounded-xl p-4 shadow-sm mb-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium text-sm">${day.week} <span class="text-gray-400 text-xs">${day.dateStr.slice(5)}</span></span>
                        ${day.today ? '<span class="text-xs bg-danger/10 text-danger px-2 rounded">今天</span>' : ''}
                    </div>
                    <div class="space-y-2">
                        ${day.courses.map(c => {
                            const kid = data.kids.find(k => k.id === c.kidId);
                            const status = c.rec ? (c.rec.isLeave ? '<span class="text-xs text-warning">已请假</span>' : '<span class="text-xs text-success">已打卡</span>') : '<span class="text-xs text-gray-500">待上课</span>';
                            return `<div class="border-l-2 pl-2 py-1" style="border-color:${c.color}">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <span class="text-xs text-gray-500 mr-2">${c.start}-${c.end}</span>
                                        <span class="text-sm">${c.name}</span>
                                        <span class="text-xs text-gray-500 ml-1">${kid.name} · 剩${getRemaining(c)}</span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        ${status}
                                        ${!c.rec ? `<div class="flex gap-1 ml-2">
                                            <button class="checkin-btn px-2 py-0.5 text-xs bg-primary text-white rounded" data-id="${c.id}">打卡</button>
                                            <button class="leave-btn px-2 py-0.5 text-xs bg-gray-100 rounded" data-id="${c.id}">请假</button>
                                        </div>` : ''}
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`).join('');
            }
            el.innerHTML = html;
        }

        function renderRecords() {
            const el = document.getElementById('page-records');
            const courseIds = getCourses().map(c=>c.id);
            const records = data.records.filter(r => courseIds.includes(r.courseId)).sort((a,b)=>new Date(b.date)-new Date(a.date));
            let html = '<h2 class="font-bold mb-3">打卡记录</h2>';
            if(records.length === 0) {
                html += '<div class="bg-white rounded-xl p-8 text-center text-gray-500 text-sm shadow-sm">还没有打卡记录</div>';
            } else {
                const grouped = {};
                records.forEach(r => {
                    const ds = formatDate(new Date(r.date));
                    if(!grouped[ds]) grouped[ds] = [];
                    grouped[ds].push(r);
                });
                html += Object.keys(grouped).map(ds => {
                    const d = new Date(ds);
                    return `<div class="mb-3">
                        <div class="text-xs text-gray-500 mb-1">${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}</div>
                        <div class="bg-white rounded-xl shadow-sm divide-y divide-gray-100">
                            ${grouped[ds].map(r => {
                                const c = data.courses.find(x=>x.id===r.courseId);
                                if(!c) return '';
                                const kid = data.kids.find(k=>k.id===c.kidId);
                                return `<div class="p-3 flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>
                                        <div>
                                            <div class="text-sm">${c.name} <span class="text-xs text-gray-500">${kid.name}</span></div>
                                            <div class="text-xs text-gray-500">${r.note || ''}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs px-2 py-0.5 rounded-full ${r.isLeave ? 'bg-warning/10 text-warning' : 'bg-success/10 text-success'}">${r.isLeave?'请假':'上课'}</span>
                                        <button class="del-rec text-gray-400" data-id="${r.id}" aria-label="删除">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
                                        </button>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }).join('');
            }
            el.innerHTML = html;
        }

        function renderStats() {
            const el = document.getElementById('page-stats');
            const courses = getCourses();
            let html = '<h2 class="font-bold mb-3">数据统计</h2>';
            if(courses.length === 0) {
                html += '<div class="bg-white rounded-xl p-8 text-center text-gray-500 text-sm shadow-sm">添加课程后查看统计</div>';
            } else {
                const totalAttend = courses.reduce((s,c)=>s+getAttended(c),0);
                const totalLeave = courses.reduce((s,c)=>s+getLeaveCount(c),0);
                const totalLeft = courses.reduce((s,c)=>s+getRemaining(c),0);
                const totalBuy = courses.reduce((s,c)=>s+c.total,0);
                html += `<div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="bg-white rounded-xl p-3 shadow-sm">
                        <div class="text-xl font-bold text-success">${totalAttend}</div>
                        <div class="text-xs text-gray-500">累计上课</div>
                    </div>
                    <div class="bg-white rounded-xl p-3 shadow-sm">
                        <div class="text-xl font-bold text-warning">${totalLeave}</div>
                        <div class="text-xs text-gray-500">累计请假</div>
                    </div>
                    <div class="bg-white rounded-xl p-3 shadow-sm">
                        <div class="text-xl font-bold text-primary">${totalLeft}</div>
                        <div class="text-xs text-gray-500">剩余课时</div>
                    </div>
                    <div class="bg-white rounded-xl p-3 shadow-sm">
                        <div class="text-xl font-bold text-secondary">${totalBuy}</div>
                        <div class="text-xs text-gray-500">总课时</div>
                    </div>
                </div>
                <h3 class="font-medium mb-2 text-sm">课程进度</h3>
                <div class="bg-white rounded-xl p-4 shadow-sm space-y-3">
                    ${courses.map(c => {
                        const left = getRemaining(c);
                        const p = c.total>0 ? Math.min(100, Math.round((c.total-left)/c.total*100)) : 0;
                        return `<div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>${c.name}</span>
                                <span class="text-gray-500">${p}%</span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-1.5">
                                <div class="h-1.5 rounded-full" style="width:${p}%;background:${c.color}"></div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            }
            el.innerHTML = html;
        }

        function renderCurrentPage() {
            if(currentPage === 'home') renderHome();
            if(currentPage === 'schedule') renderSchedule();
            if(currentPage === 'records') renderRecords();
            if(currentPage === 'stats') renderStats();
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-lg z-[60] text-sm';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(()=>t.remove(), 1500);
        }

        function showAddKid() {
            let selected = '👦';
            const html = `<div class="fixed inset-0 bg-black/50 z-50 flex items-end p-4" id="overlay">
                <div class="bg-white rounded-xl w-full p-5">
                    <h3 class="font-bold text-lg mb-4">添加孩子</h3>
                    <div class="mb-4">
                        <label class="text-sm text-gray-700 mb-2 block">头像</label>
                        <div class="flex gap-2 flex-wrap">
                            ${['👦','👧','🧒','👶'].map((a,i) => `<button type="button" class="avatar-opt w-10 h-10 rounded-full text-xl flex items-center justify-center border ${i===0?'border-primary bg-primary/10':'border-gray-200'}" data-a="${a}">${a}</button>`).join('')}
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="text-sm text-gray-700 mb-1 block">姓名</label>
                        <input type="text" id="kid-name" class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary" placeholder="例如：二宝">
                    </div>
                    <div class="flex gap-2">
                        <button id="cancel" class="flex-1 py-2.5 bg-gray-100 rounded-lg">取消</button>
                        <button id="ok" class="flex-1 py-2.5 bg-primary text-white rounded-lg">添加</button>
                    </div>
                </div>
            </div>`;
            document.getElementById('modal-container').innerHTML = html;
            
            document.querySelectorAll('.avatar-opt').forEach(b => b.onclick = () => {
                document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('border-primary','bg-primary/10'));
                b.classList.add('border-primary','bg-primary/10');
                selected = b.dataset.a;
            });
            document.getElementById('cancel').onclick = closeModal;
            document.getElementById('overlay').onclick = e => { if(e.target.id==='overlay') closeModal(); };
            document.getElementById('ok').onclick = () => {
                const name = document.getElementById('kid-name').value.trim();
                if(!name) return toast('请输入姓名');
                data.kids.push({id:'k'+Date.now(), name, avatar:selected});
                save();
                closeModal();
                toast('添加成功');
            };
        }

        function showCourseModal(id = null) {
            const course = id ? data.courses.find(c=>c.id===id) : null;
            const colors = ['#7C3AED','#EC4899','#10B981','#F59E0B','#EF4444','#06B6D4'];
            let selectedColor = course?.color || colors[0];
            let selectedDays = course?.days || [];
            
            const html = `<div class="fixed inset-0 bg-black/50 z-50 flex items-end p-4 overflow-y-auto" id="overlay">
                <div class="bg-white rounded-xl w-full p-5 mt-auto">
                    <h3 class="font-bold text-lg mb-4">${course?'编辑课程':'添加课程'}</h3>
                    <form id="course-form">
                        <div class="mb-3">
                            <label class="text-sm text-gray-700 mb-1 block">课程名称</label>
                            <input name="name" class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary" value="${course?.name||''}" placeholder="例如：钢琴课" required>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <div>
                                <label class="text-sm text-gray-700 mb-1 block">总课时</label>
                                <input name="total" type="number" min="1" class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary" value="${course?.total||24}" required>
                            </div>
                            <div>
                                <label class="text-sm text-gray-700 mb-1 block">每次扣课时</label>
                                <input name="defHours" type="number" min="0.5" step="0.5" class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary" value="${course?.defHours||1}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="text-sm text-gray-700 mb-1 block">颜色</label>
                            <div class="flex gap-2">
                                ${colors.map(c => `<button type="button" class="color-opt w-7 h-7 rounded-full border-2 ${selectedColor===c?'border-gray-800':'border-transparent'}" style="background:${c}" data-c="${c}"></button>`).join('')}
                            </div>
                        </div>
                        <div class="mb-3 space-y-2">
                            <label class="flex items-center gap-2 text-sm">
                                <input type="checkbox" name="shared" ${course?.shared?'checked':''}>
                                兄弟姐妹共享课时
                            </label>
                            <label class="flex items-center gap-2 text-sm">
                                <input type="checkbox" name="deductLeave" ${course?.deductLeave?'checked':''}>
                                请假也扣除课时
                            </label>
                            <label class="flex items-center gap-2 text-sm">
                                <input type="checkbox" id="has-fixed" ${course?.hasFixed?'checked':''}>
                                设置固定上课时间
                            </label>
                        </div>
                        <div id="fixed-sec" class="${course?.hasFixed?'':'hidden'} bg-gray-50 rounded-lg p-3 mb-3">
                            <label class="text-sm text-gray-700 mb-2 block">上课星期</label>
                            <div class="flex gap-1 mb-2 flex-wrap">
                                ${SHORT_WEEK.map((d,i) => `<label class="cursor-pointer">
                                    <input type="checkbox" class="hidden day-cb" value="${i}" ${selectedDays.includes(i)?'checked':''}>
                                    <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs border ${selectedDays.includes(i)?'bg-primary text-white border-primary':'border-gray-200'}">${d}</span>
                                </label>`).join('')}
                            </div>
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <div>
                                    <label class="text-xs text-gray-500 block mb-1">开始时间</label>
                                    <input type="time" name="start" class="w-full px-2 py-1.5 border border-gray-200 rounded" value="${course?.start||'09:00'}">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-500 block mb-1">结束时间</label>
                                    <input type="time" name="end" class="w-full px-2 py-1.5 border border-gray-200 rounded" value="${course?.end||'10:30'}">
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 block mb-1">地点（选填）</label>
                                <input name="location" class="w-full px-2 py-1.5 border border-gray-200 rounded" value="${course?.location||''}" placeholder="例如：少年宫">
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" id="cancel" class="flex-1 py-2.5 bg-gray-100 rounded-lg">取消</button>
                            <button type="submit" class="flex-1 py-2.5 bg-primary text-white rounded-lg">${course?'保存':'添加'}</button>
                        </div>
                        ${course?`<button type="button" id="del" class="w-full mt-2 py-2 text-danger text-sm">删除课程</button>`:''}
                    </form>
                </div>
            </div>`;
            document.getElementById('modal-container').innerHTML = html;
            
            document.querySelectorAll('.color-opt').forEach(b => b.onclick = () => {
                document.querySelectorAll('.color-opt').forEach(x => x.classList.remove('border-gray-800'));
                b.classList.add('border-gray-800');
                selectedColor = b.dataset.c;
            });
            
            document.querySelectorAll('.day-cb').forEach(cb => cb.onchange = () => {
                const span = cb.nextElementSibling;
                if(cb.checked) {
                    span.classList.add('bg-primary','text-white','border-primary');
                    span.classList.remove('border-gray-200');
                    if(!selectedDays.includes(parseInt(cb.value))) selectedDays.push(parseInt(cb.value));
                } else {
                    span.classList.remove('bg-primary','text-white','border-primary');
                    span.classList.add('border-gray-200');
                    selectedDays = selectedDays.filter(d => d !== parseInt(cb.value));
                }
            });
            
            document.getElementById('has-fixed').onchange = e => {
                document.getElementById('fixed-sec').classList.toggle('hidden', !e.target.checked);
            };
            
            document.getElementById('cancel').onclick = closeModal;
            document.getElementById('overlay').onclick = e => { if(e.target.id==='overlay') closeModal(); };
            
            if(course) document.getElementById('del').onclick = () => {
                if(confirm('确定删除？相关记录也会删除')) {
                    data.courses = data.courses.filter(c => c.id !== id);
                    data.records = data.records.filter(r => r.courseId !== id);
                    save();
                    closeModal();
                }
            };
            
            document.getElementById('course-form').onsubmit = e => {
                e.preventDefault();
                const f = e.target;
                const hasFixed = document.getElementById('has-fixed').checked;
                if(hasFixed && selectedDays.length === 0) return toast('请选择上课星期');
                const obj = {
                    name: f.name.value.trim(),
                    kidId: getCurrentKid().id,
                    total: parseFloat(f.total.value),
                    defHours: parseFloat(f.defHours.value),
                    color: selectedColor,
                    shared: f.shared.checked,
                    deductLeave: f.deductLeave.checked,
                    hasFixed: hasFixed,
                    days: hasFixed ? selectedDays : [],
                    start: hasFixed ? f.start.value : '',
                    end: hasFixed ? f.end.value : '',
                    location: hasFixed ? f.location.value.trim() : ''
                };
                if(course) Object.assign(course, obj);
                else data.courses.push({id:'c'+Date.now(), created:new Date().toISOString(), ...obj});
                save();
                closeModal();
                toast(course?'保存成功':'添加成功');
            };
        }

        function showCheckin(courseId, isLeave=false) {
            const course = data.courses.find(c=>c.id===courseId);
            if(!course) return;
            const html = `<div class="fixed inset-0 bg-black/50 z-50 flex items-end p-4" id="overlay">
                <div class="bg-white rounded-xl w-full p-5">
                    <h3 class="font-bold text-lg mb-3">${isLeave?'请假登记':'上课打卡'}</h3>
                    <div class="bg-gray-50 rounded-lg p-3 mb-3 text-sm">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="w-2 h-2 rounded-full" style="background:${course.color}"></span>
                            <span class="font-medium">${course.name}</span>
                        </div>
                        <div class="text-gray-500 text-xs">${isLeave?(course.deductLeave?'请假扣除1课时':'请假不扣课时'):`打卡扣除${course.defHours}课时`}</div>
                    </div>
                    <form id="checkin-form">
                        <div class="mb-3">
                            <label class="text-sm text-gray-700 mb-1 block">日期</label>
                            <input type="date" name="date" class="w-full px-3 py-2 border border-gray-200 rounded-lg" value="${formatDate(new Date())}" required>
                        </div>
                        ${!isLeave?`<div class="mb-3">
                            <label class="text-sm text-gray-700 mb-1 block">扣除课时</label>
                            <input type="number" name="hours" min="0.5" step="0.5" class="w-full px-3 py-2 border border-gray-200 rounded-lg" value="${course.defHours}" required>
                        </div>`:''}
                        <div class="mb-4">
                            <label class="text-sm text-gray-700 mb-1 block">备注（选填）</label>
                            <textarea name="note" class="w-full px-3 py-2 border border-gray-200 rounded-lg resize-none" rows="2"></textarea>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" id="cancel" class="flex-1 py-2.5 bg-gray-100 rounded-lg">取消</button>
                            <button type="submit" class="flex-1 py-2.5 ${isLeave?'bg-warning':'bg-primary'} text-white rounded-lg">确认</button>
                        </div>
                    </form>
                </div>
            </div>`;
            document.getElementById('modal-container').innerHTML = html;
            
            document.getElementById('cancel').onclick = closeModal;
            document.getElementById('overlay').onclick = e => { if(e.target.id==='overlay') closeModal(); };
            
            document.getElementById('checkin-form').onsubmit = e => {
                e.preventDefault();
                const f = e.target;
                data.records.push({
                    id:'r'+Date.now(),
                    courseId: courseId,
                    date: new Date(f.date.value).toISOString(),
                    isLeave: isLeave,
                    hours: isLeave ? (course.deductLeave?1:0) : parseFloat(f.hours.value),
                    note: f.note.value.trim()
                });
                save();
                closeModal();
                toast(isLeave?'请假成功':'打卡成功 🎉');
            };
        }

        function showSettings() {
            const html = `<div class="fixed inset-0 bg-black/50 z-50 flex items-end p-4" id="overlay">
                <div class="bg-white rounded-xl w-full p-5">
                    <h3 class="font-bold text-lg mb-4">设置</h3>
                    <div class="space-y-2 mb-4">
                        <button id="export" class="w-full py-3 bg-gray-50 rounded-lg text-left px-4 text-sm flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            导出数据备份
                        </button>
                        <button id="import-btn" class="w-full py-3 bg-gray-50 rounded-lg text-left px-4 text-sm flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            导入备份
                        </button>
                        <input type="file" id="import-file" accept=".json" class="hidden">
                        <button id="reset" class="w-full py-3 bg-gray-50 rounded-lg text-left px-4 text-sm text-danger flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
                            清空所有数据
                        </button>
                    </div>
                    <button id="cancel" class="w-full py-2.5 bg-gray-100 rounded-lg">关闭</button>
                </div>
            </div>`;
            document.getElementById('modal-container').innerHTML = html;
            
            document.getElementById('cancel').onclick = closeModal;
            document.getElementById('overlay').onclick = e => { if(e.target.id==='overlay') closeModal(); };
            
            document.getElementById('export').onclick = () => {
                const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `课程打卡备份_${formatDate(new Date())}.json`;
                a.click();
                URL.revokeObjectURL(url);
                toast('导出成功');
            };
            
            document.getElementById('import-btn').onclick = () => {
                toast('请选择备份文件');
                document.getElementById('import-file').click();
            };
            
            document.getElementById('import-file').onchange = e => {
                const f = e.target.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if(d.kids && d.courses && d.records) {
                            if(confirm('导入将覆盖当前数据，确定？')) {
                                data = d;
                                save();
                                renderKids();
                                closeModal();
                                toast('导入成功');
                            }
                        } else alert('文件格式错误');
                    } catch { alert('文件解析失败'); }
                };
                r.readAsText(f);
            };
            
            document.getElementById('reset').onclick = () => {
                if(confirm('确定清空所有数据？不可恢复！')) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                }
            };
        }

        // 事件委托
        document.addEventListener('click', e => {
            // 导航切换
            const nb = e.target.closest('.nav-btn');
            if(nb) {
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('text-primary','active');
                    b.classList.add('text-gray-500');
                });
                nb.classList.add('text-primary','active');
                nb.classList.remove('text-gray-500');
                currentPage = nb.dataset.page;
                document.querySelectorAll('#page-home,#page-schedule,#page-records,#page-stats').forEach(p => p.classList.add('hidden'));
                document.getElementById('page-'+currentPage).classList.remove('hidden');
                renderCurrentPage();
                window.scrollTo(0,0);
                return;
            }
            // 孩子切换
            const kb = e.target.closest('.kid-btn');
            if(kb) {
                if(data.currentKidId !== kb.dataset.id) {
                    data.currentKidId = kb.dataset.id;
                    save();
                } else {
                    toast('已选中当前孩子');
                }
                return;
            }
            // 添加孩子
            if(e.target.closest('#add-kid')) { showAddKid(); return; }
            // 添加课程
            if(e.target.closest('#add-btn')) { showCourseModal(); return; }
            // 设置
            if(e.target.closest('#settings-btn')) { showSettings(); return; }
            // 打卡
            const cb = e.target.closest('.checkin-btn');
            if(cb) { showCheckin(cb.dataset.id, false); return; }
            // 请假
            const lb = e.target.closest('.leave-btn');
            if(lb) { showCheckin(lb.dataset.id, true); return; }
            // 编辑课程
            const eb = e.target.closest('.edit-btn');
            if(eb) { showCourseModal(eb.dataset.id); return; }
            // 删除记录
            const dr = e.target.closest('.del-rec');
            if(dr) {
                if(confirm('确定删除这条记录？')) {
                    data.records = data.records.filter(r => r.id !== dr.dataset.id);
                    save();
                }
                return;
            }
        });

        // 每分钟刷新提醒
        setInterval(() => {
            if(currentPage === 'home') renderHome();
        }, 60000);

        // 初始化
        renderKids();
        renderHome();
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</body>
</html>
