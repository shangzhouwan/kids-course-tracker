<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可编辑大学生课表</title>
    <script src="https://aisearch-task.bj.bcebos.com/static/tailwindcss-3.4.17.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#f97316',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        purple: '#8b5cf6',
                        pink: '#ec4899',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen pb-16">
    <!-- 顶部导航 -->
    <header class="sticky top-0 bg-white border-b border-gray-200 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center text-white">
                    <i class="fa fa-calendar text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-800">我的大学课表</h1>
                    <p class="text-xs text-gray-500" id="currentDate"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="resetBtn" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600" title="重置课表" aria-label="重置课表">
                    <i class="fa fa-refresh text-lg"></i>
                </button>
                <button id="exportBtn" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600" title="导出数据" aria-label="导出数据">
                    <i class="fa fa-download text-lg"></i>
                </button>
                <button id="timeSettingsBtn" aria-label="时间设置" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600">
                    <i class="fa fa-clock-o text-lg"></i>
                </button>
                <button id="toggleEditBtn" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium hover:bg-blue-600 flex items-center gap-2">
                    <i class="fa fa-pencil"></i>
                    <span>编辑模式</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- 基本信息卡片 -->
        <div class="bg-white rounded-xl shadow-sm p-5 mb-6">
            <div class="flex flex-col md:flex-row md:items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white text-xl font-bold" id="avatarText">张</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="studentName" class="text-xl font-bold text-gray-800 outline-none">史雪鹏</span>
                        </div>
                        <div class="flex flex-wrap gap-4 text-sm text-gray-600 mt-1">
                            <span class="flex items-center gap-1">
                                <i class="fa fa-building-o text-primary"></i>
                                <span id="department" class="outline-none">计算机学院</span>
                            </span>
                            <span class="flex items-center gap-1">
                                <i class="fa fa-graduation-cap text-secondary"></i>
                                <span id="major" class="outline-none">软件工程专业</span>
                            </span>
                            <span class="flex items-center gap-1">
                                <i class="fa fa-calendar-o text-success"></i>
                                <span id="grade" class="outline-none">2000级</span>
                            </span>
                        </div>
                    </div>
                </div>
                
                <div class="md:ml-auto">
                    <!-- 周次选择 -->
                    <div class="flex items-center gap-1 bg-gray-100 p-1.5 rounded-lg">
                        <button class="week-btn px-4 py-2 rounded-md text-sm font-medium bg-white shadow-sm text-primary" data-week="1">第1周</button>
                        <button class="week-btn px-4 py-2 rounded-md text-sm font-medium text-gray-600" data-week="2">第2周</button>
                        <button class="week-btn px-4 py-2 rounded-md text-sm font-medium text-gray-600" data-week="odd">单周</button>
                        <button class="week-btn px-4 py-2 rounded-md text-sm font-medium text-gray-600" data-week="even">双周</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 课表区域 -->
        <div class="bg-white rounded-xl shadow-sm p-4 md:p-6 mb-6">
            <div class="overflow-x-auto">
                <div class="min-w-[768px]">
                    <!-- 星期表头 -->
                    <div class="grid grid-cols-8 gap-2 mb-3">
                        <div class="text-center text-sm font-medium text-gray-500 py-2">时间</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-blue-50">周一</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-blue-50">周二</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-blue-50">周三</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-blue-50">周四</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-blue-50">周五</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-orange-50">周六</div>
                        <div class="text-center text-sm font-medium text-gray-700 py-2 rounded-lg bg-orange-50">周日</div>
                    </div>
                    
                    <div id="scheduleGrid"></div>
                </div>
            </div>
            
            <button id="addTimeSlotBtn" class="w-full py-3 mt-4 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-primary hover:text-primary hidden items-center justify-center gap-2">
                <i class="fa fa-plus-circle"></i>
                <span>添加新的时间段</span>
            </button>
        </div>

        <!-- 统计和今日课程 -->
        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-sm p-5">
                <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa fa-lightbulb-o text-warning"></i>
                    今日课程
                </h3>
                <div id="todayCourses" class="space-y-3"></div>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm p-5">
                <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa fa-bar-chart text-success"></i>
                    本周统计
                </h3>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-blue-50 rounded-xl p-4 text-center">
                        <div class="text-3xl font-bold text-primary" id="totalCourses">0</div>
                        <div class="text-sm text-gray-600 mt-1">总课程数</div>
                    </div>
                    <div class="bg-orange-50 rounded-xl p-4 text-center">
                        <div class="text-3xl font-bold text-secondary" id="totalHours">0</div>
                        <div class="text-sm text-gray-600 mt-1">总学时</div>
                    </div>
                    <div class="bg-green-50 rounded-xl p-4 text-center">
                        <div class="text-3xl font-bold text-success" id="totalLocations">0</div>
                        <div class="text-sm text-gray-600 mt-1">上课地点</div>
                    </div>
                    <div class="bg-purple-50 rounded-xl p-4 text-center">
                        <div class="text-3xl font-bold text-purple" id="totalTeachers">0</div>
                        <div class="text-sm text-gray-600 mt-1">授课老师</div>
                    </div>
                </div>
                
                <div class="pt-2 text-center text-sm text-gray-500">
                    <i class="fa fa-info-circle mr-1"></i>
                    数据自动保存到本地浏览器
                </div>
            </div>
        </div>
    </main>

    <!-- 时间设置模态框 -->
    <div id="timeSettingsModal" class="fixed inset-0 bg-black/40 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto">
                <div class="p-5 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="text-lg font-bold text-gray-800">课程时间段设置</h3>
                    <button id="closeTimeSettings" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="p-5">
                    <p class="text-sm text-gray-500 mb-4">自定义每节课的节次名称、开始时间和结束时间</p>
                    <div id="timeSlotsContainer" class="space-y-3 mb-4"></div>
                    <button id="addTimeSlotModalBtn" class="w-full py-3 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-primary hover:text-primary flex items-center justify-center gap-2">
                        <i class="fa fa-plus-circle"></i>
                        <span>添加时间段</span>
                    </button>
                </div>
                <div class="p-5 border-t border-gray-100 flex gap-3">
                    <button id="cancelTimeSettings" class="flex-1 py-2.5 rounded-lg bg-gray-100 text-gray-700 font-medium hover:bg-gray-200">取消</button>
                    <button id="saveTimeSettings" class="flex-1 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-blue-600">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 课程编辑模态框 -->
    <div id="courseModal" class="fixed inset-0 bg-black/40 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-2xl w-full max-w-md">
                <div class="p-5 border-b border-gray-100">
                    <h3 class="text-lg font-bold text-gray-800" id="courseModalTitle">添加课程</h3>
                </div>
                <div class="p-5 space-y-4">
                    <input type="hidden" id="courseId">
                    <input type="hidden" id="courseDay">
                    <input type="hidden" id="courseSlotIndex">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">课程名称</label>
                        <input type="text" id="courseName" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none" placeholder="请输入课程名称">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">上课地点</label>
                            <input type="text" id="courseLocation" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none" placeholder="如：教一201">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">授课老师</label>
                            <input type="text" id="courseTeacher" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none" placeholder="请输入老师姓名">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">开始节次</label>
                            <select id="courseStartSlot" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">持续节数</label>
                            <select id="courseDuration" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none">
                                <option value="1">1节</option>
                                <option value="2" selected>2节</option>
                                <option value="3">3节</option>
                                <option value="4">4节</option>
                                <option value="5">5节</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">课程颜色</label>
                        <div class="flex gap-3 flex-wrap" id="colorOptions">
                            <label><input type="radio" name="courseColor" value="blue" class="hidden peer" checked><div class="w-9 h-9 rounded-lg bg-blue-500 peer-checked:ring-4 peer-checked:ring-blue-200"></div></label>
                            <label><input type="radio" name="courseColor" value="green" class="hidden peer"><div class="w-9 h-9 rounded-lg bg-green-500 peer-checked:ring-4 peer-checked:ring-green-200"></div></label>
                            <label><input type="radio" name="courseColor" value="orange" class="hidden peer"><div class="w-9 h-9 rounded-lg bg-orange-500 peer-checked:ring-4 peer-checked:ring-orange-200"></div></label>
                            <label><input type="radio" name="courseColor" value="purple" class="hidden peer"><div class="w-9 h-9 rounded-lg bg-purple-500 peer-checked:ring-4 peer-checked:ring-purple-200"></div></label>
                            <label><input type="radio" name="courseColor" value="pink" class="hidden peer"><div class="w-9 h-9 rounded-lg bg-pink-500 peer-checked:ring-4 peer-checked:ring-pink-200"></div></label>
                            <label><input type="radio" name="courseColor" value="cyan" class="hidden peer"><div class="w-9 h-9 rounded-lg bg-cyan-500 peer-checked:ring-4 peer-checked:ring-cyan-200"></div></label>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">周次设置</label>
                        <div class="flex flex-wrap gap-2" id="weekOptions">
                            <label><input type="radio" name="courseWeek" value="all" class="hidden peer" checked><div class="px-3 py-1.5 rounded-lg bg-gray-100 text-sm peer-checked:bg-primary peer-checked:text-white">全部周</div></label>
                            <label><input type="radio" name="courseWeek" value="1" class="hidden peer"><div class="px-3 py-1.5 rounded-lg bg-gray-100 text-sm peer-checked:bg-primary peer-checked:text-white">第1周</div></label>
                            <label><input type="radio" name="courseWeek" value="2" class="hidden peer"><div class="px-3 py-1.5 rounded-lg bg-gray-100 text-sm peer-checked:bg-primary peer-checked:text-white">第2周</div></label>
                            <label><input type="radio" name="courseWeek" value="odd" class="hidden peer"><div class="px-3 py-1.5 rounded-lg bg-gray-100 text-sm peer-checked:bg-primary peer-checked:text-white">单周</div></label>
                            <label><input type="radio" name="courseWeek" value="even" class="hidden peer"><div class="px-3 py-1.5 rounded-lg bg-gray-100 text-sm peer-checked:bg-primary peer-checked:text-white">双周</div></label>
                        </div>
                    </div>
                </div>
                <div class="p-5 border-t border-gray-100 flex gap-3">
                    <button id="deleteCourseBtn" class="py-2.5 px-4 rounded-lg bg-red-50 text-red-600 font-medium hover:bg-red-100 hidden">
                        <i class="fa fa-trash-o mr-1"></i> 删除
                    </button>
                    <button id="cancelCourseBtn" class="flex-1 py-2.5 rounded-lg bg-gray-100 text-gray-700 font-medium hover:bg-gray-200">取消</button>
                    <button id="saveCourseBtn" class="flex-1 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-blue-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 px-5 py-3 rounded-lg bg-gray-800 text-white text-sm shadow-lg z-50 hidden"></div>

    <script>
        // 默认数据
        const defaultTimeSlots = [
            { id: 1, name: '1-2节', startTime: '08:00', endTime: '09:40' },
            { id: 2, name: '3-4节', startTime: '10:00', endTime: '11:40' },
            { id: 3, name: '5-6节', startTime: '14:00', endTime: '15:40' },
            { id: 4, name: '7-8节', startTime: '16:00', endTime: '17:40' },
            { id: 5, name: '9-11节', startTime: '19:00', endTime: '21:30' }
        ];

        const defaultCourses = [
            { id: 1, day: 1, startSlot: 0, duration: 2, name: '高等数学', location: '教一201', teacher: '王教授', color: 'blue', week: 'all' },
            { id: 2, day: 1, startSlot: 2, duration: 2, name: '大学英语', location: '教三305', teacher: '李老师', color: 'green', week: 'all' },
            { id: 3, day: 2, startSlot: 0, duration: 2, name: '程序设计', location: '实验楼B402', teacher: '张教授', color: 'purple', week: 'all' },
            { id: 4, day: 2, startSlot: 3, duration: 2, name: '体育', location: '体育场', teacher: '刘教练', color: 'orange', week: 'all' },
            { id: 5, day: 3, startSlot: 1, duration: 2, name: '线性代数', location: '教二105', teacher: '陈教授', color: 'pink', week: 'all' },
            { id: 6, day: 3, startSlot: 3, duration: 2, name: '计算机导论', location: '教一301', teacher: '赵老师', color: 'cyan', week: 'all' },
            { id: 7, day: 4, startSlot: 0, duration: 2, name: '高等数学', location: '教一201', teacher: '王教授', color: 'blue', week: 'all' },
            { id: 8, day: 4, startSlot: 2, duration: 2, name: '程序设计实验', location: '实验楼A203', teacher: '张教授', color: 'purple', week: 'odd' },
            { id: 9, day: 5, startSlot: 1, duration: 2, name: '大学英语', location: '教三305', teacher: '李老师', color: 'green', week: 'all' },
            { id: 10, day: 5, startSlot: 3, duration: 2, name: '思想政治', location: '教四102', teacher: '周老师', color: 'orange', week: 'all' }
        ];

        const colorMap = {
            blue: 'bg-blue-500',
            green: 'bg-green-500',
            orange: 'bg-orange-500',
            purple: 'bg-purple-500',
            pink: 'bg-pink-500',
            cyan: 'bg-cyan-500'
        };

        const lightColorMap = {
            blue: 'bg-blue-50 border-blue-200 text-blue-700',
            green: 'bg-green-50 border-green-200 text-green-700',
            orange: 'bg-orange-50 border-orange-200 text-orange-700',
            purple: 'bg-purple-50 border-purple-200 text-purple-700',
            pink: 'bg-pink-50 border-pink-200 text-pink-700',
            cyan: 'bg-cyan-50 border-cyan-200 text-cyan-700'
        };

        let state = {
            isEditMode: false,
            currentWeek: '1',
            timeSlots: [],
            courses: [],
            studentInfo: {},
            tempTimeSlots: []
        };

        function $(id) { return document.getElementById(id); }

        function init() {
            loadData();
            updateDate();
            render();
            bindEvents();
        }

        function loadData() {
            state.timeSlots = JSON.parse(localStorage.getItem('tt_slots') || 'null') || [...defaultTimeSlots];
            state.courses = JSON.parse(localStorage.getItem('tt_courses') || 'null') || [...defaultCourses];
            state.studentInfo = JSON.parse(localStorage.getItem('tt_info') || 'null') || {
                name: '张同学', department: '计算机学院', major: '软件工程专业', grade: '2024级'
            };
            
            $('studentName').textContent = state.studentInfo.name;
            $('department').textContent = state.studentInfo.department;
            $('major').textContent = state.studentInfo.major;
            $('grade').textContent = state.studentInfo.grade;
            $('avatarText').textContent = state.studentInfo.name.charAt(0);
        }

        function saveData() {
            localStorage.setItem('tt_slots', JSON.stringify(state.timeSlots));
            localStorage.setItem('tt_courses', JSON.stringify(state.courses));
            localStorage.setItem('tt_info', JSON.stringify(state.studentInfo));
        }

        function updateDate() {
            const now = new Date();
            const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            $('currentDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
        }

        function isCourseVisible(course, week) {
            if (course.week === 'all' || course.week === week) return true;
            const w = parseInt(week);
            return (course.week === 'odd' && w%2===1) || (course.week === 'even' && w%2===0);
        }

        function render() {
            renderSchedule();
            renderTodayCourses();
            renderStats();
            updateEditUI();
        }

        function renderSchedule() {
            const grid = $('scheduleGrid');
            grid.innerHTML = '';
            
            state.timeSlots.forEach((slot, slotIdx) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-8 gap-2 mb-2';
                
                // 时间列
                const timeCol = document.createElement('div');
                timeCol.className = 'flex flex-col items-center justify-center py-3 px-2 rounded-lg bg-gray-50 text-center';
                timeCol.innerHTML = `<div class="text-sm font-medium text-gray-800">${slot.name}</div><div class="text-xs text-gray-500 mt-1">${slot.startTime}-${slot.endTime}</div>`;
                row.appendChild(timeCol);
                
                // 7天
                for (let day = 1; day <= 7; day++) {
                    const cell = document.createElement('div');
                    cell.className = 'relative rounded-lg bg-gray-50 min-h-[80px]';
                    
                    const course = state.courses.find(c => 
                        c.day === day && c.startSlot <= slotIdx && c.startSlot + c.duration > slotIdx && isCourseVisible(c, state.currentWeek)
                    );
                    
                    if (course && course.startSlot === slotIdx) {
                        const card = document.createElement('div');
                        card.className = `absolute inset-0 ${colorMap[course.color]} rounded-lg p-2 text-white cursor-pointer`;
                        card.style.height = `calc(${course.duration * 100}% + ${(course.duration-1)*8}px)`;
                        card.innerHTML = `
                            <div class="font-medium text-sm leading-tight mb-1">${course.name}</div>
                            <div class="text-xs opacity-90 flex items-center gap-1"><i class="fa fa-map-marker"></i>${course.location}</div>
                            ${course.teacher ? `<div class="text-xs opacity-90 flex items-center gap-1 mt-0.5"><i class="fa fa-user-o"></i>${course.teacher}</div>` : ''}
                        `;
                        card.onclick = () => openCourseModal(course, day, slotIdx);
                        cell.appendChild(card);
                    } else if (!course && state.isEditMode) {
                        const btn = document.createElement('button');
                        btn.className = 'absolute inset-0 flex items-center justify-center text-gray-400 hover:text-primary hover:bg-primary/5 rounded-lg';
                        btn.innerHTML = '<i class="fa fa-plus"></i>';
                        btn.onclick = () => openCourseModal(null, day, slotIdx);
                        cell.appendChild(btn);
                    }
                    
                    row.appendChild(cell);
                }
                grid.appendChild(row);
            });
            
            // 更新节次选项
            const sel = $('courseStartSlot');
            sel.innerHTML = '';
            state.timeSlots.forEach((s, i) => {
                sel.innerHTML += `<option value="${i}">${s.name}</option>`;
            });
        }

        function renderTodayCourses() {
            const container = $('todayCourses');
            container.innerHTML = '';
            const today = new Date().getDay();
            const dayIdx = today === 0 ? 7 : today;
            
            const courses = state.courses
                .filter(c => c.day === dayIdx && isCourseVisible(c, state.currentWeek))
                .sort((a,b) => a.startSlot - b.startSlot);
            
            if (courses.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-500"><i class="fa fa-coffee text-4xl mb-3 text-gray-300"></i><p>今天没有课程，好好休息吧~</p></div>`;
                return;
            }
            
            const now = new Date();
            const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            courses.forEach(course => {
                const slot = state.timeSlots[course.startSlot];
                let statusText = '待开始', statusClass = 'bg-gray-100 text-gray-600';
                if (currentTime > slot.endTime) { statusText = '已结束'; statusClass = 'bg-gray-100 text-gray-400'; }
                else if (currentTime >= slot.startTime) { statusText = '进行中'; statusClass = 'bg-green-100 text-green-700'; }
                
                const item = document.createElement('div');
                item.className = `flex items-center gap-3 p-3 rounded-xl border ${lightColorMap[course.color]}`;
                item.innerHTML = `
                    <div class="w-1 h-12 rounded-full ${colorMap[course.color]}"></div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <span class="font-medium text-gray-800">${course.name}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full ${statusClass}">${statusText}</span>
                        </div>
                        <div class="text-sm text-gray-600 mt-1 flex gap-3">
                            <span><i class="fa fa-clock-o mr-1"></i>${slot.startTime}-${slot.endTime}</span>
                            <span><i class="fa fa-map-marker mr-1"></i>${course.location}</span>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderStats() {
            const visible = state.courses.filter(c => isCourseVisible(c, state.currentWeek));
            const locations = new Set(visible.map(c => c.location));
            const teachers = new Set(visible.filter(c => c.teacher).map(c => c.teacher));
            
            $('totalCourses').textContent = visible.length;
            $('totalHours').textContent = visible.reduce((s,c) => s + c.duration*2, 0);
            $('totalLocations').textContent = locations.size;
            $('totalTeachers').textContent = teachers.size;
        }

        function updateEditUI() {
            const btn = $('toggleEditBtn');
            const addBtn = $('addTimeSlotBtn');
            const editableFields = [$('studentName'), $('department'), $('major'), $('grade')];
            
            if (state.isEditMode) {
                btn.innerHTML = '<i class="fa fa-check"></i><span>完成编辑</span>';
                btn.className = 'px-4 py-2 rounded-lg bg-success text-white text-sm font-medium hover:bg-green-600 flex items-center gap-2';
                addBtn.classList.remove('hidden');
                addBtn.classList.add('flex');
                editableFields.forEach(el => { el.contentEditable = true; el.classList.add('bg-blue-50','rounded','px-1'); });
            } else {
                btn.innerHTML = '<i class="fa fa-pencil"></i><span>编辑模式</span>';
                btn.className = 'px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium hover:bg-blue-600 flex items-center gap-2';
                addBtn.classList.add('hidden');
                addBtn.classList.remove('flex');
                editableFields.forEach(el => { el.contentEditable = false; el.classList.remove('bg-blue-50','rounded','px-1'); });
                
                // 保存编辑的信息
                state.studentInfo.name = $('studentName').textContent.trim();
                state.studentInfo.department = $('department').textContent.trim();
                state.studentInfo.major = $('major').textContent.trim();
                state.studentInfo.grade = $('grade').textContent.trim();
                $('avatarText').textContent = state.studentInfo.name.charAt(0);
                saveData();
            }
        }

        function openCourseModal(course, day, slotIdx) {
            $('courseId').value = course ? course.id : '';
            $('courseDay').value = day;
            $('courseSlotIndex').value = slotIdx;
            
            if (course) {
                $('courseModalTitle').textContent = '编辑课程';
                $('courseName').value = course.name;
                $('courseLocation').value = course.location;
                $('courseTeacher').value = course.teacher || '';
                $('courseStartSlot').value = course.startSlot;
                $('courseDuration').value = course.duration;
                document.querySelector(`input[name="courseColor"][value="${course.color}"]`).checked = true;
                document.querySelector(`input[name="courseWeek"][value="${course.week}"]`).checked = true;
                $('deleteCourseBtn').classList.remove('hidden');
            } else {
                $('courseModalTitle').textContent = '添加课程';
                $('courseName').value = '';
                $('courseLocation').value = '';
                $('courseTeacher').value = '';
                $('courseStartSlot').value = slotIdx;
                $('courseDuration').value = '2';
                document.querySelector('input[name="courseColor"][value="blue"]').checked = true;
                document.querySelector('input[name="courseWeek"][value="all"]').checked = true;
                $('deleteCourseBtn').classList.add('hidden');
            }
            
            $('courseModal').classList.remove('hidden');
        }

        function closeCourseModal() {
            $('courseModal').classList.add('hidden');
        }

        function saveCourse() {
            const id = $('courseId').value;
            const day = parseInt($('courseDay').value);
            const startSlot = parseInt($('courseStartSlot').value);
            const duration = parseInt($('courseDuration').value);
            const name = $('courseName').value.trim();
            const location = $('courseLocation').value.trim();
            const teacher = $('courseTeacher').value.trim();
            const color = document.querySelector('input[name="courseColor"]:checked').value;
            const week = document.querySelector('input[name="courseWeek"]:checked').value;
            
            if (!name || !location) { showToast('请填写课程名称和地点'); return; }
            if (startSlot + duration > state.timeSlots.length) { showToast('节数超出范围'); return; }
            
            if (id) {
                const idx = state.courses.findIndex(c => c.id === parseInt(id));
                state.courses[idx] = {...state.courses[idx], day, startSlot, duration, name, location, teacher, color, week};
            } else {
                const newId = state.courses.length ? Math.max(...state.courses.map(c => c.id)) + 1 : 1;
                state.courses.push({id: newId, day, startSlot, duration, name, location, teacher, color, week});
            }
            
            saveData();
            render();
            closeCourseModal();
            showToast(id ? '课程已更新' : '课程已添加');
        }

        function deleteCourse() {
            const id = $('courseId').value;
            if (id && confirm('确定删除这门课程吗？')) {
                state.courses = state.courses.filter(c => c.id !== parseInt(id));
                saveData();
                render();
                closeCourseModal();
                showToast('课程已删除');
            }
        }

        function openTimeSettings() {
            state.tempTimeSlots = state.timeSlots.map(s => ({...s}));
            renderTimeEditor();
            $('timeSettingsModal').classList.remove('hidden');
        }

        function closeTimeSettings() {
            $('timeSettingsModal').classList.add('hidden');
        }

        function renderTimeEditor() {
            const container = $('timeSlotsContainer');
            container.innerHTML = '';
            
            state.tempTimeSlots.forEach((slot, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-3 p-3 bg-gray-50 rounded-xl';
                row.innerHTML = `
                    <div class="flex-1 grid grid-cols-3 gap-3">
                        <input type="text" value="${slot.name}" data-field="name" data-idx="${idx}" class="time-input px-3 py-2 rounded-lg border border-gray-200 outline-none text-sm" placeholder="节次名称">
                        <input type="time" value="${slot.startTime}" data-field="startTime" data-idx="${idx}" class="time-input px-3 py-2 rounded-lg border border-gray-200 outline-none text-sm">
                        <input type="time" value="${slot.endTime}" data-field="endTime" data-idx="${idx}" class="time-input px-3 py-2 rounded-lg border border-gray-200 outline-none text-sm">
                    </div>
                    <button class="del-time-btn p-2 text-gray-400 hover:text-red-500" data-idx="${idx}"><i class="fa fa-trash-o"></i></button>
                `;
                container.appendChild(row);
            });
            
            document.querySelectorAll('.time-input').forEach(input => {
                input.oninput = (e) => {
                    const i = parseInt(e.target.dataset.idx);
                    state.tempTimeSlots[i][e.target.dataset.field] = e.target.value;
                };
            });
            
            document.querySelectorAll('.del-time-btn').forEach(btn => {
                btn.onclick = (e) => {
                    const i = parseInt(e.currentTarget.dataset.idx);
                    if (state.tempTimeSlots.length <= 1) { showToast('至少保留一个时间段'); return; }
                    state.tempTimeSlots.splice(i, 1);
                    renderTimeEditor();
                };
            });
        }

        function addTimeSlot() {
            const last = state.tempTimeSlots[state.tempTimeSlots.length - 1];
            state.tempTimeSlots.push({
                id: last ? last.id + 1 : 1,
                name: '新增时段',
                startTime: '12:00',
                endTime: '13:40'
            });
            renderTimeEditor();
        }

        function saveTimeSettings() {
            for (const slot of state.tempTimeSlots) {
                if (!slot.name || !slot.startTime || !slot.endTime) { showToast('请填写完整信息'); return; }
                if (slot.startTime >= slot.endTime) { showToast('结束时间必须晚于开始时间'); return; }
            }
            state.timeSlots = state.tempTimeSlots;
            saveData();
            render();
            closeTimeSettings();
            showToast('时间设置已保存');
        }

        function switchWeek(week) {
            state.currentWeek = week;
            document.querySelectorAll('.week-btn').forEach(btn => {
                if (btn.dataset.week === week) {
                    btn.className = 'week-btn px-4 py-2 rounded-md text-sm font-medium bg-white shadow-sm text-primary';
                } else {
                    btn.className = 'week-btn px-4 py-2 rounded-md text-sm font-medium text-gray-600';
                }
            });
            render();
        }

        function resetAll() {
            if (confirm('确定重置为默认课表吗？所有自定义数据将丢失。')) {
                state.timeSlots = [...defaultTimeSlots];
                state.courses = [...defaultCourses];
                state.studentInfo = {name: '张同学', department: '计算机学院', major: '软件工程专业', grade: '2024级'};
                $('studentName').textContent = state.studentInfo.name;
                $('department').textContent = state.studentInfo.department;
                $('major').textContent = state.studentInfo.major;
                $('grade').textContent = state.studentInfo.grade;
                $('avatarText').textContent = state.studentInfo.name.charAt(0);
                saveData();
                render();
                showToast('课表已重置');
            }
        }

        function exportData() {
            const data = {
                studentInfo: state.studentInfo,
                timeSlots: state.timeSlots,
                courses: state.courses,
                exportTime: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `课表数据_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出');
        }

        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function bindEvents() {
            $('toggleEditBtn').onclick = () => { state.isEditMode = !state.isEditMode; updateEditUI(); renderSchedule(); showToast(state.isEditMode ? '已进入编辑模式' : '已退出编辑模式'); };
            $('timeSettingsBtn').onclick = openTimeSettings;
            $('closeTimeSettings').onclick = closeTimeSettings;
            $('cancelTimeSettings').onclick = closeTimeSettings;
            $('saveTimeSettings').onclick = saveTimeSettings;
            $('addTimeSlotBtn').onclick = openTimeSettings;
            $('addTimeSlotModalBtn').onclick = addTimeSlot;
            $('cancelCourseBtn').onclick = closeCourseModal;
            $('saveCourseBtn').onclick = saveCourse;
            $('deleteCourseBtn').onclick = deleteCourse;
            $('resetBtn').onclick = resetAll;
            $('exportBtn').onclick = exportData;
            
            document.querySelectorAll('.week-btn').forEach(btn => {
                btn.onclick = () => switchWeek(btn.dataset.week);
            });
            
            $('timeSettingsModal').onclick = (e) => { if (e.target === $('timeSettingsModal')) closeTimeSettings(); };
            $('courseModal').onclick = (e) => { if (e.target === $('courseModal')) closeCourseModal(); };
        }

        init();
    </script>
</body>
</html>
